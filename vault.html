  <script>
    // 1. RUNTIME CONFIGURATION
    // This object will be dynamically populated from the database to ensure search filters and tracking loops function seamlessly.
    let videoLibrary = {}; 
    let currentContinueWatchingProgress = null;

    // Helper: Formats total integer seconds into clean MM:SS layout
    function formatDuration(totalSeconds) {
      if (!totalSeconds) return '--:--';
      const mins = Math.floor(totalSeconds / 60);
      const secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function formatRemainingTime(totalSeconds, watchedSeconds) {
      const remainingSeconds = Math.max(0, Number(totalSeconds || 0) - Number(watchedSeconds || 0));
      const mins = Math.floor(remainingSeconds / 60);
      const secs = Math.floor(remainingSeconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs} remaining`;
    }

    async function getCurrentSession() {
      const { data: { session } } = await window.dbClient.auth.getSession();
      return session || null;
    }

    async function fetchVideoLibraryMap() {
      if (Object.keys(videoLibrary).length > 0) {
        return videoLibrary;
      }

      const { data: databaseVideos, error } = await window.dbClient
        .from('videos')
        .select('id, title, description, category, language, thumbnail_url, total_seconds')
        .order('title', { ascending: true });

      if (error) throw error;

      (databaseVideos || []).forEach((video) => {
        videoLibrary[video.id] = {
          title: video.title,
          module: video.category || 'Agriculture',
          description: video.description || '',
          totalSeconds: video.total_seconds || 300,
          thumbnail: video.thumbnail_url || 'assets/thumbnails/Chemical_Spraying.svg'
        };
      });

      return videoLibrary;
    }

    async function fetchContinueWatchingProgress() {
      const session = await getCurrentSession();
      if (!session) return null;

      const { data, error } = await window.dbClient
        .from('user_video_progress')
        .select('*')
        .eq('user_id', session.user.id)
        .eq('is_completed', false)
        .order('updated_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error) throw error;
      return data || null;
    }

    async function renderContinueWatchingBanner() {
      const bannerBlock = document.getElementById('continue-watching-block');
      const bannerTitle = document.getElementById('bannerTitle');
      const bannerDesc = document.getElementById('bannerDescription');
      const bannerThumb = document.getElementById('bannerThumbnail');
      const bannerBtn = document.getElementById('bannerResumeBtn');
      const visualLink = document.getElementById('continueWatchingVisualLink');
      const bannerTimeRemaining = document.getElementById('bannerTimeRemaining');
      const bannerModule = document.getElementById('continueWatchingModule');

      if (!bannerBlock || !bannerTitle || !bannerDesc || !bannerThumb || !bannerBtn || !visualLink || !bannerTimeRemaining || !bannerModule) {
        return;
      }

      try {
        await fetchVideoLibraryMap();
        currentContinueWatchingProgress = await fetchContinueWatchingProgress();

        if (!currentContinueWatchingProgress) {
          bannerBlock.classList.add('hidden');
          return;
        }

        const videoData = videoLibrary[currentContinueWatchingProgress.video_id] || {};
        const progressSeconds = Number(currentContinueWatchingProgress.progress_seconds || 0);
        const durationSeconds = Number(currentContinueWatchingProgress.duration_seconds || videoData.totalSeconds || 0);
        const percentage = Math.min(100, Number(currentContinueWatchingProgress.percentage || 0));
        const resumeUrl = `module.html?v=${encodeURIComponent(currentContinueWatchingProgress.video_id)}&t=${Math.floor(progressSeconds)}`;

        bannerTitle.textContent = currentContinueWatchingProgress.video_title || videoData.title || 'Continue Watching';
        bannerDesc.textContent = videoData.description || 'Resume your last in-progress training module.';
        bannerThumb.src = videoData.thumbnail || 'assets/thumbnails/Chemical_Spraying.svg';
        bannerThumb.alt = `${bannerTitle.textContent} thumbnail`;
        bannerBtn.href = resumeUrl;
        visualLink.href = resumeUrl;
        bannerTimeRemaining.textContent = formatRemainingTime(durationSeconds, progressSeconds);
        bannerModule.textContent = `${Math.max(0, Math.round(percentage))}% complete`;
        bannerBlock.classList.remove('hidden');
      } catch (error) {
        console.error('Error rendering continue watching banner:', error);
        bannerBlock.classList.add('hidden');
      }
    }

    // 2. DYNAMIC SUPABASE FETCH & INJECTION ENGINE
    async function fetchAndRenderVault() {
      try {
        const gridTarget = document.getElementById('videoCardsGrid');
        if (!gridTarget) return;

        // Fetch columns directly from your Supabase PostgreSQL table
        const { data: databaseVideos, error } = await window.dbClient
          .from('videos')
          .select('id, title, description, category, language, thumbnail_url, total_seconds')
          .order('title', { ascending: true });

        if (error) throw error;

        // Clear layout skeleton
        gridTarget.innerHTML = '';

        if (!databaseVideos || databaseVideos.length === 0) {
          gridTarget.innerHTML = `<p class="text-sm text-muted col-span-full text-center py-8">No active safety modules found in the database.</p>`;
          return;
        }

        // Loop through records, build runtime mapping, and inject styled grid columns
        databaseVideos.forEach(video => {
          // Sync database properties with active structural loops
          videoLibrary[video.id] = {
            title: video.title,
            module: video.category || 'Agriculture',
            description: video.description || '',
            totalSeconds: video.total_seconds || 300,
            thumbnail: video.thumbnail_url || 'assets/thumbnails/Chemical_Spraying.svg'
          };

          const cardHTML = `
            <a href="module.html?v=${video.id}" 
               class="video-card group block bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:border-primary/20" 
               data-title="${video.title.toLowerCase()}" 
               data-category="${(video.category || 'agriculture').toLowerCase()}" 
               data-language="${(video.language || 'zu').toLowerCase()}">
              <div class="relative aspect-video bg-slate-800 border-b border-slate-700 overflow-hidden">
                <img src="${video.thumbnail_url || 'assets/thumbnails/Chemical_Spraying.svg'}" alt="${video.title} thumbnail" class="absolute inset-0 w-full h-full object-contain p-1">
                <div class="absolute bottom-2 right-2 bg-black/80 text-white text-xs font-medium px-2 py-1 rounded">
                  ${formatDuration(video.total_seconds)}
                </div>
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                  <div class="bg-white/20 backdrop-blur-sm p-3 rounded-full">
                    <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  </div>
                </div>
              </div>
              <div class="p-4 flex flex-col justify-between">
                <div>
                  <h3 class="font-serif text-foreground font-medium mb-1 line-clamp-2 text-lg">${video.title}</h3>
                  <p class="text-xs text-muted mb-3">${video.category || 'Agriculture'}</p>
                </div>
                <div class="flex items-center justify-between mt-2">
                  <span id="status-${video.id}" class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-800">Not Started</span>
                  <div class="w-1/2 bg-slate-200 rounded-full h-1.5">
                    <div id="progress-${video.id}" class="bg-primary h-1.5 rounded-full" style="width: 0%"></div>
                  </div>
                </div>
              </div>
            </a>
          `;
          gridTarget.insertAdjacentHTML('beforeend', cardHTML);
        });

        // 3. EXECUTE METRIC ROUTINES (Only runs after cards are securely drawn into DOM)
        renderContinueWatchingBanner();
        renderAllVideoProgress();
        setupSearchAndFilters(); // Attaches client-side search listener routines to newly rendered nodes

      } catch (err) {
        console.error('CRITICAL SYSTEM ERROR: Failed rendering Vault modules:', err.message);
      }
    }

   // 4. PROGRESS UTILITIES & SUPABASE RENDERING ENGINE
    const renderAllVideoProgress = async () => {
      try {
        const session = await getCurrentSession();
        if (!session?.user?.id) return;

        // Fetch user video progress from Supabase
        const { data: progressList, error } = await window.dbClient
          .from('user_video_progress')
          .select('*')
          .eq('user_id', session.user.id);

        if (error) {
          console.error("Error fetching progress from Supabase:", error);
          return;
        }

        // Build progress map by video_id
        const progressMap = {};
        (progressList || []).forEach(row => {
          progressMap[String(row.video_id)] = row;
        });

        // Loop over each video card in the DOM and apply real-time progress & status styles
        Object.keys(videoLibrary).forEach(videoId => {
          const progressFill = document.getElementById(`progress-${videoId}`);
          const statusText = document.getElementById(`status-${videoId}`);
          const cardLink = document.querySelector(`a[href*="v=${videoId}"]`);
          const userProgress = progressMap[String(videoId)];

          if (!userProgress) {
            // Not Started
            if (progressFill) progressFill.style.width = '0%';
            if (statusText) {
              statusText.textContent = 'Not Started';
              statusText.className = 'inline-flex items-center rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-800';
            }
            return;
          }

          if (userProgress.is_completed) {
            // Completed: badge shows 'Completed', full bar width, link starts at beginning (t=0)
            if (progressFill) {
              progressFill.style.width = '100%';
              progressFill.className = 'bg-green-500 h-1.5 rounded-full';
            }
            if (statusText) {
              statusText.textContent = 'Completed';
              statusText.className = 'inline-flex items-center rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-700';
            }
            if (cardLink) {
              cardLink.href = `module.html?v=${encodeURIComponent(videoId)}&t=0`;
            }
          } else if (userProgress.percentage > 0) {
            // In Progress: badge shows % complete, bar width reflects exact percentage
            const pct = Math.min(99, Math.max(1, Math.round(userProgress.percentage)));
            const progressSecs = Math.floor(userProgress.progress_seconds || 0);

            if (progressFill) {
              progressFill.style.width = `${pct}%`;
              progressFill.className = 'bg-primary h-1.5 rounded-full';
            }
            if (statusText) {
              statusText.textContent = `${pct}% Complete`;
              statusText.className = 'inline-flex items-center rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-700';
            }
            if (cardLink) {
              cardLink.href = `module.html?v=${encodeURIComponent(videoId)}&t=${progressSecs}`;
            }
          }
        });
      } catch (err) {
        console.error("Failed rendering video card progress:", err);
      }
    };

    // 5. CLIENT-SIDE LIVE DRILL DOWN / FILTERS
    function setupSearchAndFilters() {
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');
      const languageFilter = document.getElementById('languageFilter');

      function filterHandler() {
        const query = searchInput.value.toLowerCase().trim();
        const category = categoryFilter.value.toLowerCase();
        const language = languageFilter.value.toLowerCase();
        const cards = document.querySelectorAll('.video-card');

        cards.forEach(card => {
          const title = card.getAttribute('data-title') || '';
          const cat = card.getAttribute('data-category') || '';
          const lang = card.getAttribute('data-language') || '';

          const matchSearch = title.includes(query);
          const matchCat = (category === 'all' || cat === category);
          const matchLang = (language === 'all' || lang === language);

          if (matchSearch && matchCat && matchLang) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });
      }

      if (searchInput) searchInput.addEventListener('input', filterHandler);
      if (categoryFilter) categoryFilter.addEventListener('change', filterHandler);
      if (languageFilter) languageFilter.addEventListener('change', filterHandler);
    }

    // 6. INITIALIZATION HOOK
    // Tie the database loop into the existing security verification lifecycle cleanly
    window.addEventListener('load', async () => {
      await renderContinueWatchingBanner();
      fetchAndRenderVault();
    });
  </script>

</body>
